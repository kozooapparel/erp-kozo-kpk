# Sinkronisasi otomatis fork dari repo upstream (raidwear/raidwear),
# lalu terapkan migrasi Supabase ke database milik fork itu sendiri.
#
# Workflow ini HANYA berjalan di fork. Di repo upstream job-nya di-skip
# lewat kondisi `if` di bawah, jadi tidak pernah menyentuh database siapa pun.
#
# Catatan penting: sync dan migrasi sengaja digabung dalam SATU workflow.
# Push yang dilakukan GITHUB_TOKEN tidak memicu workflow lain (proteksi
# anti-recursion dari GitHub), jadi kalau migrasi dipisah ke workflow
# ber-trigger `push`, migrasi itu tidak akan pernah jalan setelah auto-sync.

name: Sync upstream & migrasi DB

on:
  schedule:
    # 02:17 UTC = 09:17 WIB setiap hari.
    # Menit tidak bulat untuk menghindari antrean padat GitHub Actions.
    - cron: '17 2 * * *'
  workflow_dispatch:
    inputs:
      force_migration:
        description: 'Paksa jalankan migrasi DB walau tidak ada file migrasi baru'
        type: boolean
        default: false
      mark_all_as_applied:
        description: 'Tandai SEMUA migrasi sudah diterapkan (sekali saja, untuk database lama yang dibuat manual)'
        type: boolean
        default: false

permissions:
  contents: write

concurrency:
  group: fork-sync-${{ github.ref }}
  cancel-in-progress: false

env:
  # Secret ini diisi di fork masing-masing user, bukan di repo upstream.
  # Kosongkan / jangan isi di upstream supaya migrasi otomatis ter-skip.
  SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
  SUPABASE_PROJECT_REF: ${{ secrets.SUPABASE_PROJECT_REF }}
  SUPABASE_DB_PASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}

jobs:
  sync:
    name: Sync kode & migrasi database
    runs-on: ubuntu-latest

    # Jangan pernah jalan di repo upstream.
    if: github.repository != 'raidwear/raidwear'

    steps:
      - name: Checkout fork
        uses: actions/checkout@v4
        with:
          ref: master
          fetch-depth: 0

      - name: Konfigurasi git
        run: |
          git config user.name  'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'

      - name: Ambil upstream
        run: |
          git remote add upstream https://github.com/raidwear/raidwear.git
          git fetch --no-tags upstream master

      # Menghitung SHA sebelum/sesudah dan menentukan apakah sync & migrasi perlu jalan.
      # Semua keputusan diambil di satu tempat supaya langkah berikutnya tinggal baca output.
      - name: Hitung perubahan
        id: plan
        run: |
          LOCAL=$(git rev-parse HEAD)
          REMOTE=$(git rev-parse upstream/master)
          FORCE='${{ github.event.inputs.force_migration }}'
          MARK_ALL='${{ github.event.inputs.mark_all_as_applied }}'

          echo "local=$LOCAL"   >> "$GITHUB_OUTPUT"
          echo "remote=$REMOTE" >> "$GITHUB_OUTPUT"
          echo "mark_all=$MARK_ALL" >> "$GITHUB_OUTPUT"

          if [ "$LOCAL" = "$REMOTE" ]; then
            echo "code_changed=false" >> "$GITHUB_OUTPUT"
            echo 'Kode fork sudah sama dengan upstream.'
          else
            echo "code_changed=true" >> "$GITHUB_OUTPUT"
            echo "Ada update dari upstream:"
            git log --oneline "$LOCAL..$REMOTE"
          fi

          MIGRATIONS_CHANGED=false
          if [ "$LOCAL" != "$REMOTE" ]; then
            if [ -n "$(git diff --name-only "$LOCAL" "$REMOTE" -- supabase/migrations)" ]; then
              MIGRATIONS_CHANGED=true
            fi
          fi

          SHOULD_MIGRATE=false
          if [ "$FORCE" = 'true' ]; then
            SHOULD_MIGRATE=true
            echo 'Migrasi dipaksa jalan lewat input workflow_dispatch.'
          elif [ "$MIGRATIONS_CHANGED" = 'true' ]; then
            SHOULD_MIGRATE=true
            echo 'File migrasi berubah:'
            git diff --name-only "$LOCAL" "$REMOTE" -- supabase/migrations
          fi
          echo "should_migrate=$SHOULD_MIGRATE" >> "$GITHUB_OUTPUT"

      - name: Fast-forward fork ke upstream
        if: steps.plan.outputs.code_changed == 'true'
        run: |
          if ! git merge --ff-only upstream/master; then
            echo '::error::Fork ini sudah diverge dari upstream karena ada commit lokal.'
            echo '::error::Auto-sync menolak menimpa perubahanmu. Selesaikan dulu commit lokal,'
            echo '::error::atau reset fork ke upstream/master, lalu jalankan ulang workflow ini.'
            exit 1
          fi
          git push origin master
          echo 'Fork berhasil disinkronkan. Vercel akan auto-deploy dari push ini.'

      - name: Setup Supabase CLI
        if: (steps.plan.outputs.should_migrate == 'true' || steps.plan.outputs.mark_all == 'true') && env.SUPABASE_PROJECT_REF != ''
        uses: supabase/setup-cli@v1
        with:
          # Dipatok sama dengan versi lokal supaya hasil migrasi konsisten.
          version: 2.117.0

      # Dipakai SEKALI untuk database lama yang skemanya dibuat manual lewat SQL editor.
      # Tanpa ini, `db push` akan mencoba membuat ulang tabel yang sudah ada dan gagal.
      - name: Tandai semua migrasi sebagai sudah diterapkan
        if: steps.plan.outputs.mark_all == 'true' && env.SUPABASE_PROJECT_REF != ''
        run: |
          VERSIONS=$(ls supabase/migrations | sed -E 's/^([0-9]{14}).*/\1/' | sort)
          echo 'Versi yang ditandai applied:'
          echo "$VERSIONS"
          # shellcheck disable=SC2086
          supabase migration repair --project-ref "$SUPABASE_PROJECT_REF" --status applied $VERSIONS

      - name: Cek migrasi yang akan diterapkan
        if: steps.plan.outputs.should_migrate == 'true' && env.SUPABASE_PROJECT_REF != ''
        run: supabase db push --project-ref "$SUPABASE_PROJECT_REF" --dry-run

      - name: Terapkan migrasi ke database fork
        if: steps.plan.outputs.should_migrate == 'true' && env.SUPABASE_PROJECT_REF != ''
        run: supabase db push --project-ref "$SUPABASE_PROJECT_REF"

      - name: Peringatan jika secret Supabase belum diisi
        if: steps.plan.outputs.should_migrate == 'true' && env.SUPABASE_PROJECT_REF == ''
        run: |
          echo '::warning::Ada migrasi baru, tapi SUPABASE_PROJECT_REF belum diisi di fork ini.'
          echo '::warning::Kode sudah ter-update, tapi skema database BELUM. Isi secret'
          echo '::warning::SUPABASE_ACCESS_TOKEN, SUPABASE_PROJECT_REF, dan SUPABASE_DB_PASSWORD'
          echo '::warning::di Settings > Secrets and variables > Actions, lalu jalankan ulang.'

      - name: Ringkasan
        if: always()
        run: |
          echo "code_changed   = ${{ steps.plan.outputs.code_changed }}"
          echo "should_migrate = ${{ steps.plan.outputs.should_migrate }}"
          echo "mark_all       = ${{ steps.plan.outputs.mark_all }}"
          echo "project_ref    = ${{ env.SUPABASE_PROJECT_REF != '' && 'terisi' || 'KOSONG' }}"
