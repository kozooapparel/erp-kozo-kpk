# PENTING: file ini sengaja dibuat setipis mungkin dan DIBEKUKAN.
#
# Token bawaan GitHub Actions (GITHUB_TOKEN) tidak diizinkan GitHub untuk
# membuat/mengubah file di .github/workflows/*. Izin `workflows` tidak pernah
# diberikan ke token Actions dan tidak bisa dilonggarkan lewat `permissions:`.
# Karena auto-sync fork melakukan `git push` memakai token itu, setiap
# perubahan pada file ini di upstream akan membuat push ke SEMUA fork ditolak:
#   refusing to allow a GitHub App to create or update workflow ... without
#   workflows permission
#
# Karena itu seluruh logika dipindahkan ke scripts/fork-sync.sh — file biasa,
# jadi bebas berubah lewat auto-sync tanpa memicu penolakan di atas.
#
# Kalau file ini memang harus diubah (mis. menaikkan versi Supabase CLI di
# bawah), setiap fork perlu sekali klik "Sync fork" di halaman GitHub fork-nya
# (atau `gh repo sync <user>/raidwear --source raidwear/raidwear`), lalu
# jalankan ulang workflow ini.

name: Sync upstream & migrasi DB

on:
  schedule:
    # 02:17 UTC = 09:17 WIB setiap hari.
    # Menit tidak bulat untuk menghindari antrean padat GitHub Actions.
    - cron: '17 2 * * *'
  workflow_dispatch:
    inputs:
      mark_all_as_applied:
        description: 'Tandai SEMUA migrasi sudah diterapkan (sekali saja, untuk database lama yang dibuat manual)'
        type: boolean
        default: false

permissions:
  contents: write

concurrency:
  group: fork-sync-${{ github.ref }}
  cancel-in-progress: false

env:
  # Secret ini diisi di fork masing-masing user, bukan di repo upstream.
  # Kosongkan / jangan isi di upstream supaya migrasi otomatis ter-skip.
  SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
  SUPABASE_PROJECT_REF: ${{ secrets.SUPABASE_PROJECT_REF }}
  SUPABASE_DB_PASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}

jobs:
  sync:
    name: Sync kode & migrasi database
    runs-on: ubuntu-latest

    # Jangan pernah jalan di repo upstream.
    if: github.repository != 'raidwear/raidwear'

    steps:
      - name: Checkout fork
        uses: actions/checkout@v4
        with:
          # Repo ini default branch-nya `main`, bukan `master`.
          ref: main
          fetch-depth: 0

      - name: Setup Supabase CLI
        if: env.SUPABASE_PROJECT_REF != ''
        uses: supabase/setup-cli@v1
        with:
          # Dipatok sama dengan versi lokal supaya hasil migrasi konsisten.
          version: 2.117.0

      - name: Sync upstream & terapkan migrasi
        env:
          UPSTREAM_REPO: raidwear/raidwear
          DEFAULT_BRANCH: master
          MARK_ALL_AS_APPLIED: ${{ github.event.inputs.mark_all_as_applied }}
        run: bash scripts/fork-sync.sh
